<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #111; background: #f5f5f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .app { width: min(980px, 100%); display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    .card { background: white; border: 2px solid #111; border-radius: 24px; padding: 24px; box-shadow: 8px 8px 0 #111; }
    h1 { font-size: clamp(40px, 7vw, 76px); line-height: .9; margin: 0 0 14px; letter-spacing: -0.06em; }
    .sub { margin: 0 0 22px; color: #555; }

    .drop {
      aspect-ratio: 4/5; border: 3px dashed #111; border-radius: 18px;
      display: grid; place-items: center; overflow: hidden; cursor: pointer;
      background: #fafafa; position: relative; transition: background .15s, border-color .15s;
    }
    .drop.dragover { background: #eef; border-color: #333; }
    .drop img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .drop span { padding: 30px; text-align: center; font-weight: 700; }
    .drop small { display: block; margin-top: 8px; font-weight: 500; color: #777; }
    input[type=file] { display: none; }

    .actions { display: flex; gap: 10px; margin-top: 16px; }
    button {
      border: 2px solid #111; background: #111; color: white; border-radius: 14px;
      padding: 15px 18px; font-size: 18px; font-weight: 800; cursor: pointer;
      flex: 1; transition: transform .1s;
    }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .5; cursor: wait; }
    button.secondary { background: white; color: #111; }
    #retakeBtn { display: none; }

    .score { font-size: 84px; line-height: .9; font-weight: 900; letter-spacing: -0.07em; }
    .aura { display: inline-block; margin: 10px 0 14px; padding: 8px 12px; border-radius: 999px; background: #e9ff5a; border: 2px solid #111; font-weight: 900; }
    .section { margin-top: 18px; }
    .section h3 { margin: 0 0 7px; font-size: 14px; text-transform: uppercase; letter-spacing: .1em; }
    ul { margin: 0; padding-left: 20px; }
    .verdict { margin-top: 22px; padding-top: 18px; border-top: 2px solid #111; font-size: 26px; font-weight: 900; }

    .loading { display: none; padding: 16px 0 0; font-weight: 800; }
    .loading.show { display: flex; align-items: center; gap: 10px; }
    .spinner {
      width: 16px; height: 16px; border: 3px solid #111; border-top-color: transparent;
      border-radius: 50%; animation: spin .7s linear infinite; flex: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error { display: none; margin-top: 12px; color: #b00020; font-weight: 800; }
    .error.show { display: block; }

    .shareBtn {
      display: none; margin-top: 12px; width: 100%; background: white; color: #111;
      border: 2px solid #111; border-radius: 14px; padding: 12px 16px; font-weight: 800; cursor: pointer;
    }

    @media (max-width: 780px) { .app { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>DRIP<br>CHECK.</h1>
      <p class="sub">Upload a fit. Let the AI rate your aura.</p>

      <label class="drop" for="photo" id="dropZone">
        <img id="preview" alt="Outfit preview" />
        <span id="dropText">📸 Tap, drop, or paste a photo of your outfit<small>JPG or PNG, up to ~8MB</small></span>
      </label>
      <input id="photo" type="file" accept="image/*" capture="environment" />

      <div class="actions">
        <button id="judgeBtn" disabled>Judge My Outfit</button>
        <button id="retakeBtn" class="secondary" type="button">Retake</button>
      </div>

      <div id="loading" class="loading"><span class="spinner"></span><span>AI is judging… try not to panic.</span></div>
      <div id="error" class="error"></div>
    </section>

    <section class="card" id="resultCard">
      <div class="score" id="score">—/10</div>
      <div class="aura" id="aura">AURA: ???</div>
      <div class="palette-detected" id="paletteDetected" style="display:none; font-size: 13px; font-weight: 700; color: #222; background: #f0f0f0; padding: 7px 12px; border-radius: 8px; margin: 4px 0 14px; border: 1.5px solid #111;"></div>
      <p id="vibe">Your verdict will appear here.</p>

      <div class="section">
        <h3>Why it works</h3>
        <ul id="wins"><li>Upload a photo first.</li></ul>
      </div>

      <div class="section">
        <h3>The roast</h3>
        <p id="roast">Waiting patiently.</p>
      </div>

      <div class="section">
        <h3>Upgrade</h3>
        <p id="upgrade">You'll get one concrete styling suggestion.</p>
      </div>

      <div class="verdict" id="verdict">THE INTERNET WILL DECIDE.</div>
      <button id="shareBtn" class="shareBtn" type="button">📋 Copy result</button>
    </section>
  </main>

  <script type="module">
    import { judgeOutfit } from './vision-engine.js?v=20260917_09';

    let netModel = null;
    if (typeof mobilenet !== 'undefined') {
      mobilenet.load({ version: 2, alpha: 1.0 }).then(m => {
        netModel = m;
        window.aiMobilenetModel = m;
      }).catch(e => console.warn('MobileNet load:', e));
    }

    const photo = document.getElementById('photo');
    const dropZone = document.getElementById('dropZone');
    const preview = document.getElementById('preview');
    const dropText = document.getElementById('dropText');
    const judgeBtn = document.getElementById('judgeBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const shareBtn = document.getElementById('shareBtn');

    let imageData = null;
    let lastResult = null;

    function setImage(file) {
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = () => {
        imageData = reader.result;
        preview.src = imageData;
        preview.style.display = 'block';
        dropText.style.display = 'none';
        judgeBtn.disabled = false;
        retakeBtn.style.display = 'block';
        error.classList.remove('show');
      };
      reader.readAsDataURL(file);
    }

    photo.addEventListener('change', () => setImage(photo.files?.[0]));

    // Drag and drop support
    ['dragover', 'dragenter'].forEach(evt =>
      dropZone.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.add('dragover'); })
    );
    ['dragleave', 'drop'].forEach(evt =>
      dropZone.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.remove('dragover'); })
    );
    dropZone.addEventListener('drop', e => setImage(e.dataTransfer.files?.[0]));

    // Paste support (Ctrl+V an image from clipboard)
    window.addEventListener('paste', e => {
      const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
      if (item) setImage(item.getAsFile());
    });

    retakeBtn.addEventListener('click', e => {
      e.preventDefault();
      imageData = null;
      photo.value = '';
      preview.style.display = 'none';
      dropText.style.display = 'block';
      judgeBtn.disabled = true;
      retakeBtn.style.display = 'none';
      const palEl = document.getElementById('paletteDetected');
      if (palEl) palEl.style.display = 'none';
    });

    judgeBtn.addEventListener('click', async () => {
      if (!imageData) return;
      judgeBtn.disabled = true;
      loading.classList.add('show');
      error.classList.remove('show');
      shareBtn.style.display = 'none';

      try {
        if (!netModel && typeof mobilenet !== 'undefined') {
          try {
            netModel = await mobilenet.load({ version: 2, alpha: 1.0 });
            window.aiMobilenetModel = netModel;
          } catch {}
        }
        const data = await judgeOutfit(imageData, netModel);

        lastResult = data;
        document.getElementById('score').textContent = `${data.score}/10`;
        document.getElementById('aura').textContent = `AURA: ${data.aura}`;
        if (data.detectedPalette) {
          const palEl = document.getElementById('paletteDetected');
          if (data.detectedPalette.top.includes('Shirtless') || data.detectedPalette.top.includes('Bare Skin')) {
            palEl.textContent = `🎯 Scanned: ${data.detectedPalette.top} · ${data.detectedPalette.mid} bottom`;
          } else {
            palEl.textContent = `🎯 Scanned: ${data.detectedPalette.top} top · ${data.detectedPalette.mid} bottom · ${data.detectedPalette.bottom} shoes`;
          }
          palEl.style.display = 'block';
        }
        document.getElementById('vibe').textContent = data.vibe;
        document.getElementById('wins').innerHTML = data.wins.map(x => `<li>${escapeHtml(x)}</li>`).join('');
        document.getElementById('roast').textContent = data.roast;
        document.getElementById('upgrade').textContent = data.upgrade;
        document.getElementById('verdict').textContent = data.verdict;
        shareBtn.style.display = 'block';
      } catch (err) {
        error.textContent = err.message;
        error.classList.add('show');
      } finally {
        judgeBtn.disabled = false;
        loading.classList.remove('show');
      }
    });

    shareBtn.addEventListener('click', async () => {
      if (!lastResult) return;
      const text = `DripCheck: ${lastResult.score}/10 — AURA: ${lastResult.aura}\n${lastResult.verdict}`;
      try {
        await navigator.clipboard.writeText(text);
        shareBtn.textContent = '✅ Copied!';
        setTimeout(() => (shareBtn.textContent = '📋 Copy result'), 1500);
      } catch {
        error.textContent = 'Could not copy to clipboard.';
        error.classList.add('show');
      }
    });

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }
  </script>
</body>
</html>
